<section class="card">
  <h2>Profile</h2>

  @if (profileSaved()) {
    <app-alert type="success" (close)="profileSaved.set(false)">Profile updated!</app-alert>
  }
  @if (profileError()) {
    <app-alert type="error" (close)="profileError.set(null)">{{ profileError() }}</app-alert>
  }

  <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" novalidate class="account-form">
    <div class="form-row">
      <div class="form-field">
        <label for="first-name">First name</label>
        <input id="first-name" type="text" formControlName="firstName" />
      </div>
      <div class="form-field">
        <label for="last-name">Last name</label>
        <input id="last-name" type="text" formControlName="lastName" />
      </div>
    </div>
    <div class="form-field">
      <label>Email</label>
      <input type="email" [value]="auth.user()?._id ?? ''" disabled />
    </div>
    <button
      type="submit"
      class="btn-primary"
      [disabled]="profileLoading() || !profileForm.dirty || profileSaving()"
    >
      {{ profileSaving() ? 'Saving…' : 'Save changes' }}
    </button>
  </form>
</section>

<section class="card">
  <h2>Change password</h2>

  @if (passwordSaved()) {
    <app-alert type="success" (close)="passwordSaved.set(false)">Password changed!</app-alert>
  }
  @if (passwordError()) {
    <app-alert type="error" (close)="passwordError.set(null)">{{ passwordError() }}</app-alert>
  }

  <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" novalidate class="account-form">
    <div class="form-field">
      <label for="current-password">Current password</label>
      <div class="password-field">
        <input
          id="current-password"
          [type]="showCurrentPassword() ? 'text' : 'password'"
          formControlName="currentPassword"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="btn-toggle-password"
          (click)="showCurrentPassword.update((v) => !v)"
        >
          {{ showCurrentPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
      @if (isOAuthUser()) {
        <small class="form-hint">Leave blank if you've never set a password.</small>
      }
    </div>
    <div class="form-field">
      <label for="new-password">New password</label>
      <div class="password-field">
        <input
          id="new-password"
          [type]="showNewPassword() ? 'text' : 'password'"
          formControlName="newPassword"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="btn-toggle-password"
          (click)="showNewPassword.update((v) => !v)"
        >
          {{ showNewPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
    </div>
    <button type="submit" class="btn-primary" [disabled]="!passwordForm.valid || passwordSaving()">
      {{ passwordSaving() ? 'Changing…' : 'Change password' }}
    </button>
  </form>
</section>
